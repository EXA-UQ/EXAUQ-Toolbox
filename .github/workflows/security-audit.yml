name: Security Audit
run-name: "Security audit upon ${{ github.event_name }} from ${{ github.ref_name }}"
on:
  pull_request:
    branches: [main, dev, "releases/**"]
  schedule:
    # Weekly, Mondays at 06:00 UTC - catches CVEs published between PRs
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poetry
        run: pipx install poetry
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: "poetry"
      - name: Install dependencies
        run: poetry install --with=dev --all-extras
      - name: Audit environment for known vulnerabilities
        run: poetry run pip-audit

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
