name: Security Audit
run-name: "Security audit upon ${{ github.event_name }} from ${{ github.ref_name }}"
on:
  pull_request:
    branches: [main, dev, "releases/**"]
  schedule:
    # Weekly, Mondays at 06:00 UTC - catches CVEs published between PRs
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poetry
        run: pipx install poetry
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: "poetry"
      - name: Install dependencies
        run: poetry install --with=dev
      - name: Audit environment for known vulnerabilities
        run: poetry run pip-audit

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
