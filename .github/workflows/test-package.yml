# This workflow will install EXAUQ-Toolbox, with dependencies, and run unit
# tests. For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Test Python Package
run-name: "Test Python package upon ${{ github.event_name }} from ${{ github.ref_name }}"
on:
  pull_request:
    branches: [main, dev, "releases/**"]
  repository_dispatch:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  job1:
    name: Run unittest tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Poetry
      run: pipx install poetry
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: "poetry"
    - name: Poetry lock
      run: poetry lock
    - name: Install dependencies
      # --all-extras installs pymc (bayhem extra) on 3.12+ only; BayHEM tests skip elsewhere
      run: poetry install --with=dev --all-extras
    - name: Run unit tests
      run: poetry run python -m unittest discover tests/