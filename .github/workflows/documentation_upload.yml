name: Documentation Upload
on:
  push:
    branches:
      - main
  repository_dispatch:
  workflow_dispatch:
  workflow_call:
    
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Step 2: Configure Git credentials
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      # Step 3: Set up Python
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      # Step 4: Cache Poetry dependencies
      - name: Cache Poetry dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      # Step 5: Install Poetry
      - name: Install Poetry
        run: pipx install poetry

      # Step 6: Install dependencies with Poetry
      - name: Install dependencies
        run: poetry install --with=dev

      # Step 7: Build Jupyter notebooks
      - name: Build Jupyter notebooks
        run: |
          set -e
          set -x
          poetry run python scripts/build_notebooks.py

      # Step 8: Build MkDocs site
      - name: Build MkDocs
        run: |
          set -e
          set -x
          poetry run mkdocs build

      # Step 9: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        run: |
          set -e
          set -x
          poetry run mkdocs gh-deploy --force
