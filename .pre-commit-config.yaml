repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
    - id: black
      types_or: [python]
      args: ["--line-length", "90"]

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks